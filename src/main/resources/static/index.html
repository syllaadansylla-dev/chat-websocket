<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Chat WebSocket — Demo</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: #f3f4f6;
        padding: 2rem;
        min-height: 100vh;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
      .header {
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: white;
        padding: 1.5rem;
      }
      .header h1 {
        font-size: 1.4rem;
      }
      .status {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        font-size: 0.8rem;
        margin-top: 0.5rem;
      }
      .status.connected {
        background: #16a34a;
      }
      .status.error {
        background: #dc2626;
      }

      .config-bar {
        padding: 1rem;
        background: #f9fafb;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        gap: 0.75rem;
      }
      .config-bar input {
        flex: 1;
        padding: 0.5rem 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 6px;
      }
      .btn {
        padding: 0.5rem 1rem;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
      }
      .btn-primary {
        background: #4f46e5;
        color: white;
      }
      .btn-primary:hover {
        background: #4338ca;
      }
      .btn-primary:disabled {
        background: #9ca3af;
        cursor: not-allowed;
      }
      .btn-danger {
        background: #dc2626;
        color: white;
      }

      .messages {
        height: 400px;
        overflow-y: auto;
        padding: 1rem;
        background: #fafafa;
      }
      .message {
        margin-bottom: 0.75rem;
        padding: 0.75rem 1rem;
        background: white;
        border-radius: 8px;
        border-left: 4px solid #4f46e5;
      }
      .message .meta {
        font-size: 0.75rem;
        color: #6b7280;
        margin-bottom: 0.25rem;
      }
      .message .meta strong {
        color: #4f46e5;
        font-size: 0.9rem;
      }

      .input-bar {
        padding: 1rem;
        border-top: 1px solid #e5e7eb;
        display: flex;
        gap: 0.75rem;
      }
      .input-bar input {
        flex: 1;
        padding: 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 8px;
      }
      .input-bar input:focus {
        outline: none;
        border-color: #4f46e5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Chat WebSocket</h1>
        <p>Demo Spring Boot + STOMP</p>
        <span id="status" class="status">🔴 Déconnecté</span>
      </div>

      <div class="config-bar">
        <input
          type="text"
          id="pseudo"
          placeholder="Votre pseudo"
          value="Utilisateur"
        />
        <button class="btn btn-primary" id="btnConnect" onclick="connecter()">
          Se connecter
        </button>
        <button
          class="btn btn-danger"
          id="btnDisconnect"
          onclick="deconnecter()"
          disabled
        >
          Quitter
        </button>
      </div>

      <div class="messages" id="messages">
        <div class="message">
          <div class="meta"><strong>Système</strong> — maintenant</div>
          <div>Bienvenue ! Connectez-vous pour commencer.</div>
        </div>
      </div>

      <div class="input-bar">
        <input
          type="text"
          id="messageInput"
          placeholder="Tapez votre message…"
          disabled
          onkeydown="if (event.key === 'Enter') envoyer();"
        />
        <button
          class="btn btn-primary"
          id="btnSend"
          onclick="envoyer()"
          disabled
        >
          Envoyer
        </button>
      </div>
    </div>

    <!-- ===================================================== -->
    <!-- 2. Bibliothèques STOMP + SockJS                       -->
    <!-- ===================================================== -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

    <script>
      let stompClient = null;
      let pseudo = "";

      function connecter() {
        pseudo = document.getElementById("pseudo").value.trim() || "Anonyme";
        console.log("🔌 Tentative de connexion...");

        // ✅ Nouvelle syntaxe STOMP.js v7
        stompClient = new StompJs.Client({
          webSocketFactory: () => new SockJS("http://localhost:8080/ws-chat"),
          reconnectDelay: 5000,
          debug: (msg) => console.log("[STOMP]", msg), // ✅ v7 : debug en fonction
        });

        stompClient.onConnect = () => {
          console.log("✅ Connecté !");
          setStatus("🟢 Connecté : " + pseudo, "connected");

          stompClient.subscribe("/topic/chat", (message) => {
            const msg = JSON.parse(message.body);
            afficherMessage(msg);
          });

          stompClient.publish({
            destination: "/app/chat/join",
            body: JSON.stringify({ expediteur: pseudo, contenu: "" }),
          });

          document.getElementById("messageInput").disabled = false;
          document.getElementById("btnSend").disabled = false;
          document.getElementById("btnConnect").disabled = true;
          document.getElementById("btnDisconnect").disabled = false;
          document.getElementById("messageInput").focus();
        };

        stompClient.onStompError = (frame) => {
          console.error("❌ Erreur STOMP :", frame.headers["message"]);
          setStatus("🔴 Erreur de connexion", "error");
        };

        stompClient.onWebSocketError = (event) => {
          console.error("❌ Erreur WebSocket :", event);
          setStatus("🔴 Erreur réseau", "error");
        };

        stompClient.activate(); // ✅ Démarre la connexion
      }

      function deconnecter() {
        if (stompClient && stompClient.active) {
          stompClient.publish({
            destination: "/app/chat/leave",
            body: JSON.stringify({ expediteur: pseudo, contenu: "" }),
          });
          stompClient.deactivate();
        }
        setStatus("🔴 Déconnecté", "");
        document.getElementById("messageInput").disabled = true;
        document.getElementById("btnSend").disabled = true;
        document.getElementById("btnConnect").disabled = false;
        document.getElementById("btnDisconnect").disabled = true;
      }

      function envoyer() {
        const input = document.getElementById("messageInput");
        const contenu = input.value.trim();
        if (!contenu || !stompClient || !stompClient.connected) return;

        stompClient.publish({
          destination: "/app/chat",
          body: JSON.stringify({ expediteur: pseudo, contenu: contenu }),
        });

        input.value = "";
        input.focus();
      }

      function afficherMessage(msg) {
        const conteneur = document.getElementById("messages");
        const div = document.createElement("div");
        div.className = "message";
        div.innerHTML = `
            <div class="meta">
                <strong>${escapeHtml(msg.expediteur || "Système")}</strong>
                — ${escapeHtml(msg.dateEnvoi || "")}
            </div>
            <div>${escapeHtml(msg.contenu || "")}</div>
        `;
        conteneur.appendChild(div);
        conteneur.scrollTop = conteneur.scrollHeight;
      }

      function setStatus(texte, classe) {
        const el = document.getElementById("status");
        el.textContent = texte;
        el.className = "status" + (classe ? " " + classe : "");
      }

      function escapeHtml(str) {
        return String(str ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      // ⚠️ SUPPRIME cette ligne si elle existe : elle cause la violation "unload"
      // window.addEventListener("beforeunload", () => { ... });
    </script>
  </body>
</html>
